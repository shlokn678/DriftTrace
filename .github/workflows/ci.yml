# DriftTrace CI (FR-16). Runs on push and pull request.
# Broker-free, Airflow-free, and credential-free (FR-16.2, FR-16.4, NFR-7):
# no Redpanda/Kafka, no Airflow, no cloud accounts, no secrets are referenced.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No repository secrets are used anywhere in this workflow (NFR-7).
permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spec targets >=3.11; 3.13 is the current dev environment (decision D-29).
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + tracking + serving + streaming + explain extras
        # Core + dev tooling + MLflow + FastAPI/httpx (serving tests) + confluent-kafka
        # (streaming adapter import tests) + SHAP/LIME (explainability tests). No Airflow,
        # no running broker, no cloud dependencies. Tests never connect to a real broker
        # (FR-16.2, NFR-8).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tracking,serving,streaming,explain]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (black)
        run: python -m black --check src tests

      - name: Type check (mypy)
        run: python -m mypy

      - name: Unit + schema tests
        # The full suite is broker-free / Airflow-free / Docker-free (NFR-8).
        # Schema validation tests are part of tests/unit (FR-2, FR-16.1).
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python -m pytest -p no:cacheprovider -q

      - name: Schema tests (explicit, FR-16.1)
        # Run the schema/validation tests on their own so a schema regression is a
        # clearly named CI failure, as required by FR-2.1 / FR-16.1.
        run: python -m pytest tests/unit/test_schema_validate.py -q

  docker:
    name: Docker build + Compose validation + smoke test
    runs-on: ubuntu-latest
    # Credential-free: no registry login, no secrets, no cloud. The image is built
    # and exercised locally on the runner only (FR-16.3, NFR-7).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the project image
        run: docker build -f docker/Dockerfile -t drifttrace:ci .

      - name: Validate Compose configuration (core + full)
        run: |
          docker compose -f docker/docker-compose.yml --profile core config --quiet
          docker compose -f docker/docker-compose.yml --profile full config --quiet

      - name: Compose smoke test (core profile)
        # Bring up the core profile (init trains the model into a shared volume, then
        # api + webhook-stub start). Verify the API health/readiness and one prediction,
        # and confirm the prediction emitted an event. Broker-free.
        run: |
          set -euo pipefail
          docker tag drifttrace:ci drifttrace:latest
          docker compose -f docker/docker-compose.yml --profile core up -d --wait --wait-timeout 240
          echo "== health =="
          curl -fsS http://localhost:8000/health
          echo "== ready =="
          curl -fsS http://localhost:8000/ready
          echo "== predict =="
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"income": 4200.0, "request_id": "ci-1"}' | tee /tmp/predict.json
          grep -q '"event_emitted":true' /tmp/predict.json
          echo "== webhook stub health =="
          curl -fsS http://localhost:9000/health

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile core logs

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile core --profile full down -v

# DriftTrace CI. Runs on push and pull request.
# Broker-free, Docker-free, and credential-free: no Redpanda/Kafka, no Docker,
# no cloud accounts, no secrets are referenced.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No repository secrets are used anywhere in this workflow (NFR-7).
permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spec targets >=3.11; 3.13 is the current dev environment (decision D-29).
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + serving + streaming + explain extras
        # Core + dev tooling + FastAPI/httpx (serving tests) + confluent-kafka (streaming
        # adapter import tests) + SHAP/LIME (explainability). No Docker, no running broker,
        # no cloud dependencies. Tests never connect to a real broker (NFR-8).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,serving,streaming,explain]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (black)
        run: python -m black --check src tests

      - name: Type check (mypy)
        run: python -m mypy

      - name: Unit + integration tests
        # The full suite is broker-free and Docker-free (NFR-8).
        run: python -m pytest -p no:cacheprovider -q

  bootstrap:
    name: Fresh-clone bootstrap + API smoke test
    runs-on: ubuntu-latest
    # Local-first: no Docker, no broker, no cloud, no secrets. Prepares runtime dirs
    # (no built-in model), then exercises the bundle upload -> activate -> predict ->
    # drift-test workflow with models built on the fly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (serving extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serving]"

      - name: Bootstrap runtime directories (no model is created)
        run: python -m drifttrace.bootstrap

      - name: API smoke test (upload -> activate -> predict -> drift test -> RCA)
        run: python scripts/smoke_api.py

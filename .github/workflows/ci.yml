# DriftTrace CI (FR-16). Runs on push and pull request.
# Broker-free, Airflow-free, and credential-free (FR-16.2, FR-16.4, NFR-7):
# no Redpanda/Kafka, no Airflow, no cloud accounts, no secrets are referenced.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No repository secrets are used anywhere in this workflow (NFR-7).
permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spec targets >=3.11; 3.13 is the current dev environment (decision D-29).
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + tracking extras
        # Core + dev tooling + MLflow (for the registry integration tests). No broker,
        # no Airflow, no cloud dependencies are installed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tracking]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (black)
        run: python -m black --check src tests

      - name: Type check (mypy)
        run: python -m mypy

      - name: Unit + schema tests
        # The full suite is broker-free / Airflow-free / Docker-free (NFR-8).
        # Schema validation tests are part of tests/unit (FR-2, FR-16.1).
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python -m pytest -p no:cacheprovider -q

      - name: Schema tests (explicit, FR-16.1)
        # Run the schema/validation tests on their own so a schema regression is a
        # clearly named CI failure, as required by FR-2.1 / FR-16.1.
        run: python -m pytest tests/unit/test_schema_validate.py -q

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriftTrace · ML Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="DriftTrace - detect ML drift, trace the dependency graph, identify the root cause."
    />
    <!-- Apply the saved (or default light) theme before first paint to avoid a
         flash of the wrong theme. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("drifttrace-theme");
          var theme = saved === "dark" || saved === "light" ? saved : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

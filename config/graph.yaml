# DriftTrace — declared dependency graph (DECISION: YAML -> NetworkX)
# Single source of truth for feature computation order AND RCA upstream traversal.
# Placeholder shape; finalized during Phase 1. Preserves the pitch chain.
nodes:
  income:
    kind: raw_input
    drift: { ks: true, psi: true }
  credit_score:
    kind: derived_feature
    parents: [income]
    drift: { ks: true, psi: true }
  risk_score:
    kind: derived_feature
    parents: [credit_score]
    drift: { ks: true, psi: true }
  prediction:
    kind: model_output
    parents: [risk_score]
edges:
  - [income, credit_score]
  - [credit_score, risk_score]
  - [risk_score, prediction]

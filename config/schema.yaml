# DriftTrace - declared data schema for validation (FR-2)
# Per column: type, nullability, and an allowed range (numeric) or category set.
# This is the data contract enforced before training and serving.
columns:
  income:
    type: float
    nullable: false
    min: 0
  credit_score:
    type: float
    nullable: false
    min: 300
    max: 900
  risk_score:
    type: float
    nullable: false
    min: 0
    max: 1
  group:
    type: category
    nullable: false
    categories: [A, B]
  default:
    type: int
    nullable: false
    categories: [0, 1]

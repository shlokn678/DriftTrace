# DriftTrace - responsible-AI config (model-agnostic).
# A sensitive attribute is DECLARED explicitly and never inferred. There is no default:
# fairness analysis is unavailable unless an operator declares a sensitive attribute
# that exists in their model's features.
fairness:
  sensitive_attribute: null    # e.g. "region"; leave null when none applies
  positive_label: 1            # the positive/adverse class label for classifiers
privacy:
  # Field names that must never appear in logs, artifacts, or event payloads (NFR-9).
  pii_deny_list: [name, email, phone, ssn, address, customer_id, account_number]
  prediction_log_retention_note: >
    Prediction event logs are local JSON-lines for the local/demo workflow and are not
    retained beyond the run; production would set a bounded retention window.

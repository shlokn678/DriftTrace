# DriftTrace - responsible-AI config (FR-15).
# The sensitive attribute is DECLARED explicitly here and never inferred (FR-15.4).
# It refers to the synthetic 'group' column produced by the local data generator.
fairness:
  sensitive_attribute: group   # declared synthetic attribute; values A/B
  positive_label: 1            # 'default' == 1 is the positive (adverse) outcome
privacy:
  # Fields that must never appear in logs, artifacts, or event payloads (FR-15.5, NFR-9).
  pii_deny_list: [name, email, phone, ssn, address, customer_id, account_number]
  prediction_log_retention_note: >
    Prediction event logs are local JSON-lines for the MVP demo and are not retained
    beyond the demo run; production would set a bounded retention window.

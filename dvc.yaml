# DriftTrace DVC pipeline (demonstration).
# A single stage that validates the DVC-tracked demo data (mlops_demo_data/,
# itself tracked via `dvc add` -> mlops_demo_data.dvc) and writes a metrics
# report. This is a supporting utility, separate from the live drift/RCA engine.
stages:
  validate_demo_data:
    cmd: python scripts/validate_mlops_demo_data.py
    deps:
      - mlops_demo_data
      - scripts/validate_mlops_demo_data.py
    metrics:
      - mlops_demo_summary.json:
          cache: false

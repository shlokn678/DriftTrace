[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drifttrace"
version = "0.1.0"
description = "End-to-End MLOps System for Automated Root-Cause Analysis of ML Drift (CI3203D)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DriftTrace Team" }]

# Core runtime dependencies (broker-free, framework-light).
# Pinned with lower bounds; exact versions captured in the environment at install time.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Serving adapter (FastAPI + Docker) - Phase 3
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
# Experiment tracking + registry - Phase 1
tracking = [
    "mlflow>=2.11",
]
# Streaming adapter (Kafka API via Redpanda) - Phase 3
streaming = [
    "confluent-kafka>=2.3",
]
# Explainability - Phase 4
explain = [
    "shap>=0.44",
    "lime>=0.2.0.1",
]
# Orchestration adapter (Airflow) - Phase 2. Optional so it never blocks core dev.
orchestration = [
    "apache-airflow>=2.8",
]
# Developer tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
drifttrace = "drifttrace.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drifttrace = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.isort]
known-first-party = ["drifttrace"]

[tool.mypy]
python_version = "3.13"
packages = ["drifttrace"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests, no external services",
    "integration: cross-module tests, still no broker/Docker/Airflow",
    "e2e: end-to-end scenario tests",
]

[tool.coverage.run]
source = ["drifttrace"]
branch = true
